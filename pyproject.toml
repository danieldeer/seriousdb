[project]
name = "seriousdb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
	"ty>=0.0.81",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ------------------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------------------

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Endpoints are documented through their decorator metadata instead.
"src/seriousdb/main.py" = ["D100", "D103"]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
