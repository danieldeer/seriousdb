[project]
name = "seriousdb"
version = "0.1.0"
description = "A seriously simple key-value database"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Daniel Hirsch", email = "contact@hirschdaniel.com" },
]
keywords = ["database", "key-value", "storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/danieldeer/seriousdb"
Repository = "https://github.com/danieldeer/seriousdb"
Documentation = "https://github.com/danieldeer/seriousdb/tree/main/docs"

[dependency-groups]
benchmark = [
    "pytest-benchmark>=5.3.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["benchmark: engine performance scenarios configured by pytest-benchmark"]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Endpoints are documented through their decorator metadata instead.
"src/seriousdb/main.py" = ["D100", "D103"]
"benchmarks/**" = ["D"]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
root = ["."]
