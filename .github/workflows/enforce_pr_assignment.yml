name: Enforce PR assignment

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-assignment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Check linked issue assignment
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          # This privileged workflow must never execute code from the PR head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check assignment after the grace period
        uses: actions/github-script@v8 # v8
        with:
          script: |
            const enforceAssignment = require("./.github/scripts/enforce-pr-assignment.js");
            await enforceAssignment({ github, context, core });
