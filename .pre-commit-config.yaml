default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.15
    hooks:
      - id: uv-lock

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: type-check
        name: ty
        entry: uvx ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: uv-ruff
        name: ruff
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: uv-ruff-format
        name: ruff-format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: uv-mdformat
        name: mdformat
        entry: uv run --locked mdformat --check
        language: system
        types: [markdown]
        exclude: ^docs/reference/
        stages: [pre-commit]

      - id: docs-reference
        name: docs-reference
        entry: uv run --locked --group docs scripts/docs-reference.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(src/seriousdb/|docs/_sphinx/|docs/reference/)
